name: PR Agent Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'release/**'
      - 'feature/**'
  # Required for claude-code-action @claude mentions
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  pr-analysis:
    name: Analyze PR with AI Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Debug Environment
        run: |
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Repository: ${{ github.repository }}"
          echo "Event Path: ${{ github.event_path }}"
          echo "Token length: ${#GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run PR Agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Azure OpenAI credentials
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          # Deployment name - supports both variable names
          AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${{vars.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME || 'gpt-4.1'}}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-02-15-preview' }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          TRACING_BACKEND: ${{ vars.TRACING_BACKEND || 'appinsights' }}
        run: |
          # Run the PR agent from the root directory
          python pr-agent.py

  # Claude Code Action using Azure AI Foundry
  # Runs automatically on every PR + responds to @claude mentions in comments
  claude:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          # Default prompt for automatic PR reviews
          prompt: |
            Review this Pull Request and provide:
            1. A summary of the changes
            2. Code quality assessment
            3. Potential bugs or issues
            4. Security concerns if any
            5. Suggestions for improvement
          use_foundry: "true"
          allowed_tools: "edit,write,bash"
        env:
          # Azure AI Foundry configuration
          CLAUDE_CODE_USE_FOUNDRY: "1"
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ secrets.ANTHROPIC_FOUNDRY_RESOURCE }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          # Optional: specify model deployment names if different from defaults
          # ANTHROPIC_DEFAULT_SONNET_MODEL: "claude-sonnet-4-5"
