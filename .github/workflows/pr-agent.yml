name: PR Agent Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'release/**'
      - 'feature/**'
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  pr-analysis:
    name: Analyze PR with AI Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Debug Environment
        run: |
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Repository: ${{ github.repository }}"
          echo "Event Path: ${{ github.event_path }}"
          echo "Token length: ${#GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run PR Agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Azure OpenAI credentials
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          # Deployment name - supports both variable names
          AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${{vars.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME || 'gpt-4.1'}}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-02-15-preview' }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          TRACING_BACKEND: ${{ vars.TRACING_BACKEND || 'appinsights' }}
        run: |
          # Run the PR agent from the root directory
          python pr-agent.py

      - uses: anthropics/claude-code-action@v1
        with:
          use_foundry: "true"
          prompt: "Review and generate the summary of changes"
          claude_args: |
            --model claude-sonnet-4-5
          # ... other inputs
        env:
          ANTHROPIC_FOUNDRY_BASE_URL: ${{ secrets.ANTHROPIC_FOUNDRY_BASE_URL }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
